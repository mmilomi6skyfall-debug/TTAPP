name: Temporary dependency lock resolution

on:
  push:
    branches:
      - security/production-dependency-remediation-2026-10-23
    paths:
      - 'package.json'
      - '.github/workflows/dependency-lock-resolution.yml'
  pull_request:
    branches:
      - implementation/approved-directions-2026-10-23

permissions:
  contents: write

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit generated lockfile to remediation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: regenerate lockfile with patched dependencies"
            git push origin HEAD:security/production-dependency-remediation-2026-10-23
          fi
      - name: Capture production audit
        run: npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Upload generated lock and audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-resolution-output
          path: |
            package-lock.json
            npm-audit-production.json
          if-no-files-found: error
          retention-days: 7
