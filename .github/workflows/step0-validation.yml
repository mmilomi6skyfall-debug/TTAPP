name: Step 0 validation

on:
  push:
    branches:
      - implementation/approved-directions-2026-10-23
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'db/**'
      - 'api/openapi.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/step0-validation.yml'

permissions:
  contents: read

concurrency:
  group: step0-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compile backend
        run: npm run build

      - name: Run unit tests
        run: npm test -- --runInBand

  openapi:
    name: Validate OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint api/openapi.yaml
